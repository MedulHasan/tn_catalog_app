name: CI/CD for catalog app

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      android:
        type: boolean
        default: true
      ios:
        type: boolean
        default: false

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: print
        run: |
          echo "${{github.ref_name}} - ${{inputs.android}} - ${{inputs.IOS}}"

      - name: Android Build
        if: ${{github.ref_name == 'mh/dev' && inputs.android}}
        uses: ./.github/actions/android

      - name: IOS Build
        if: ${{github.ref_name == 'mh/dev' && inputs.ios}}
        uses: ./.github/actions/ios
