name: Android build

inputs:
  keystoreBase64:
    required: true
  keyPassword:
    required: true
  keyAlias:
    required: true

runs:
  using: 'composite'
  steps:
    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
    - name: Decode & Store Android Keystore
      shell: bash
      run: |
        echo "${{ inputs.keystoreBase64 }}" | base64 --decode > android/app/catalog.jks
    - name: Make gradlew executable (Grant Permission)
      shell: bash
      run: chmod +x android/gradlew
    - name: Build APK
      shell: bash
      working-directory: android
      run: ./gradlew assembleRelease -PkeyPassword=${{ inputs.keyPassword }} -PkeyAlias=${{ inputs.keyAlias }}
    - name: After Check apk
      shell: bash
      run: ls -l app/build/outputs/apk/release/*apk
